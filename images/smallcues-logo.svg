<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Rounded square background -->
  <rect x="2" y="2" width="60" height="60" rx="9" fill="#2c7fff"/>

  <!-- Envelope -->
  <g>
    <!-- Envelope body -->
    <rect x="17" y="22" width="30" height="20" fill="white" rx="2"/>

    <!-- Envelope flap -->
    <path d="M 17 22 L 32 35 L 47 22"
          fill="none"
          stroke="#2c7fff"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Envelope edges -->
    <rect x="17" y="22" width="30" height="20" fill="none" stroke="#2c7fff" stroke-width="2" rx="2"/>
  </g>
</svg>
